name: Java CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21]
    name: Java ${{ matrix.java }}
    steps:
      - name: Checkout API Challenges
        uses: actions/checkout@v4
        with:
          path: apichallenges

      - name: Checkout Thingifier dependency
        uses: actions/checkout@v4
        with:
          repository: eviltester/thingifier
          ref: master
          path: thingifier

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Thingifier dependency
        run: >
          mvn -B -f thingifier/pom.xml -pl ercoremodel,thingifier -am install
          -DskipTests
          -Dspotless.check.skip=true
          -Dcheckstyle.skip=true
          -Dpmd.skip=true

      - name: Check formatting
        if: matrix.java == 21
        run: mvn -B -f apichallenges/pom.xml spotless:check

      - name: Check API From Hell standalone assets
        if: matrix.java == 21
        run: |
          python apichallenges/api-from-hell/tooling/catalog-validator/validate_catalog.py \
            apichallenges/api-from-hell/catalog/fromhell-catalog.json
          python -m compileall -q \
            apichallenges/api-from-hell/tooling \
            apichallenges/api-from-hell/implementations/python-native-http \
            apichallenges/api-from-hell/implementations/python-flask
          node --check apichallenges/api-from-hell/implementations/node-native-http/server.js
          node --check apichallenges/api-from-hell/implementations/node-express/server.js
          mvn -B -f apichallenges/api-from-hell/implementations/java-javalin/pom.xml test
          python apichallenges/api-from-hell/tooling/openapi-generator/generate_openapi.py \
            apichallenges/api-from-hell/catalog/fromhell-catalog.json \
            --output /tmp/fromhell-openapi.json
          python apichallenges/api-from-hell/tooling/mockoon-generator/generate_mockoon.py \
            apichallenges/api-from-hell/catalog/fromhell-catalog.json \
            --output /tmp/fromhell-mockoon.json
          PORT=3901 node apichallenges/api-from-hell/implementations/node-native-http/server.js \
            > /tmp/fromhell-node.log 2>&1 &
          server_pid=$!
          trap 'kill ${server_pid} || true; cat /tmp/fromhell-node.log' EXIT
          sleep 2
          python apichallenges/api-from-hell/tooling/conformance-tests/run_conformance.py \
            --base-url http://localhost:3901
          kill ${server_pid}
          trap - EXIT

      - name: Run API Challenges tests
        run: mvn -B -f apichallenges/pom.xml clean test

      - name: Package deployable app
        run: mvn -B -f apichallenges/pom.xml -pl challenger -am package -DskipTests

      - name: Run ChallengerAuto memory regression
        run: >
          mvn -B -f apichallenges/pom.xml -pl challengerAuto -am test
          -Dchallenger.auto.target=local
          -Dchallenger.auto.local.repository=memory
          -Dchallenger.auto.local.playerMode=multi

      - name: Run ChallengerAuto sqlite-memory regression
        run: >
          mvn -B -f apichallenges/pom.xml -pl challengerAuto -am test
          -Dchallenger.auto.target=local
          -Dchallenger.auto.local.repository=sqlite-memory
          -Dchallenger.auto.local.playerMode=multi

      - name: Static analysis
        if: matrix.java == 21
        run: mvn -B -f apichallenges/pom.xml -DskipTests verify

      - name: Upload deployable jar
        uses: actions/upload-artifact@v4
        with:
          name: apichallenges-java-${{ matrix.java }}
          path: apichallenges/challenger/target/apichallenges.jar
